[project]
name = "projectm"
version = "1.0.0"
description = "ProjectM - MyGov Monitor dashboard with root user hierarchy, groups & search engine mode (FastAPI + SQLite + PWA)"
requires-python = ">=3.11"
dependencies = [
    "apscheduler>=3.11.3",
    "cryptography>=50.0.0",
    "fastapi>=0.141.1",
    "gunicorn>=26.2.0",
    "httptools>=0.8.0",
    "httpx>=0.28.1",
    "itsdangerous>=2.2.0",
    "jinja2>=3.1.6",
    "python-dotenv>=1.2.3",
    "python-jose>=3.5.0",
    "python-multipart>=0.0.32",
    "slowapi>=0.1.10",
    "sqlalchemy>=2.0.52",
    "starlette-csrf>=3.0.0",
    "uvicorn>=0.52.4",
    # uvloop は Windows 非対応のため Linux/macOS のみ (本番は Linux VPS)
    "uvloop>=0.22.1; sys_platform != 'win32'",
    "websockets>=17.0.1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
