<!DOCTYPE html>
<html lang="{{ lang|default('ja') }}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0381fe">
  <title>{{ t.login|default('ログイン') }} | ProjectW</title>
  <link rel="manifest" href="/static/manifest.json">
  <link rel="stylesheet" href="/static/app.css">
</head>
<body class="login">
  <div class="login-card">
    <div class="login-logo">W</div>
    <h1 class="login-title">ProjectW</h1>
    <p class="login-subtitle">{{ t.get('login_subtitle', 'サイト監視ダッシュボードにログイン') }}</p>

    <form id="magic-form">
      <div class="field">
        <label class="field-label" for="email">{{ t.email|default('メールアドレス') }}</label>
        <input type="email" id="email" name="email" placeholder="you@example.com" required autocomplete="email">
      </div>
      <button type="submit" class="btn" id="magic-btn">{{ t.send_magic_link|default('マジックリンクを送信') }}</button>
    </form>

    <div id="msg" class="message" role="status" aria-live="polite"></div>

    <details class="pw-login">
      <summary>{{ t.login_with_password|default('パスワードでログイン') }}</summary>
      <form id="password-form">
        <div class="field">
          <label class="field-label" for="pw-email">{{ t.email|default('メールアドレス') }}</label>
          <input type="email" id="pw-email" name="email" placeholder="you@example.com" required autocomplete="email">
        </div>
        <div class="field">
          <label class="field-label" for="password">{{ t.password|default('パスワード') }}</label>
          <input type="password" id="password" name="password" required autocomplete="current-password">
        </div>
        <button type="submit" class="btn" id="pw-btn">{{ t.login|default('ログイン') }}</button>
      </form>
    </details>
  </div>

  <script src="/static/app.js"></script>
  <script>
    var msgEl = document.getElementById("msg");
    function showMsg(text, type) {
      msgEl.textContent = text || "";
      msgEl.className = "message" + (type ? " " + type : "");
    }

    document.getElementById("magic-form").addEventListener("submit", async function (e) {
      e.preventDefault();
      var btn = document.getElementById("magic-btn");
      var email = document.getElementById("email").value.trim();
      if (!email) return;
      btn.disabled = true;
      showMsg("送信中…", "");
      try {
        var data = await api("POST", "/auth/magic", { email: email });
        if (data && data.ok) {
          showMsg(data.msg || "マジックリンクを送信しました。メールをご確認ください。", "success");
          toast(data.msg || "マジックリンクを送信しました");
        } else {
          showMsg((data && data.msg) || "送信に失敗しました。", "error");
        }
      } catch (err) {
        showMsg((err && err.data && err.data.msg) || "送信に失敗しました。", "error");
      } finally {
        btn.disabled = false;
      }
    });

    document.getElementById("password-form").addEventListener("submit", async function (e) {
      e.preventDefault();
      var btn = document.getElementById("pw-btn");
      var email = document.getElementById("pw-email").value.trim();
      var password = document.getElementById("password").value;
      if (!email || !password) return;
      btn.disabled = true;
      showMsg("認証中…", "");
      try {
        var data = await api("POST", "/auth/password", { email: email, password: password });
        if (data && data.ok) {
          showMsg(data.msg || "ログインしました。", "success");
          window.location = data.redirect || "/";
        } else {
          showMsg((data && data.msg) || "ログインに失敗しました。", "error");
        }
      } catch (err) {
        showMsg((err && err.data && err.data.msg) || "ログインに失敗しました。", "error");
      } finally {
        btn.disabled = false;
      }
    });

    if ("serviceWorker" in navigator) {
      window.addEventListener("load", function () {
        navigator.serviceWorker.register("/static/sw.js").catch(function () {});
      });
    }
  </script>
</body>
</html>
